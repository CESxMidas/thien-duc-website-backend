name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npm run build

      - run: npm test

  # E2E smoke (task →8): Postgres dùng một lần trong CI — credentials bên dưới
  # là giá trị vứt đi của service container, KHÔNG phải secret production.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: thienduc_ci
          POSTGRES_PASSWORD: thienduc_ci
          POSTGRES_DB: thien_duc_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thienduc_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://thienduc_ci:thienduc_ci@localhost:5432/thien_duc_e2e?schema=public
      JWT_ACCESS_SECRET: e2e-only-secret-not-used-anywhere-else
      ADMIN_EMAIL: e2e-admin@example.com
      ADMIN_PASSWORD: e2e-password-123
      # BẮT BUỘC: `prisma/seed.js` mặc định ADMIN_ROLE = SUPER_ADMIN, mà
      # SUPER_ADMIN được bỏ qua luồng duyệt (`initialContentStatus`) nên bài
      # tạo mới ra thẳng PUBLISHED. Smoke test lại khẳng định bài mới phải là
      # DRAFT → thiếu dòng này là CI đỏ với "Expected: DRAFT / Received:
      # PUBLISHED". Tài khoản bootstrap E2E phải đúng vai trò ADMIN.
      ADMIN_ROLE: ADMIN
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma validate

      - run: npx prisma migrate deploy

      - run: npm run prisma:seed

      # Chốt sớm: nếu tài khoản bootstrap sai vai trò thì dừng ngay ở đây với
      # thông điệp chỉ đúng nguyên nhân, thay vì để smoke test báo "Expected:
      # DRAFT / Received: PUBLISHED" ở tận cuối. Chỉ in role/setup/active.
      - run: npm run prisma:verify:bootstrap

      # test:e2e = smoke HTTP + integration PostgreSQL thật (auth-integration).
      # e2e-setup.ts bật MAIL_FAKE_TRANSPORT=1 để test tương tranh tất định.
      - run: npm run test:e2e
